name: Novo card do formulário

# O Apps Script do formulário grava pendentes/<id>.json; este workflow vira isso em card + imagem
# (scripts/processar-pendentes.mjs), faz o commit e dispara o deploy.
on:
  push:
    branches: [main]
    paths: ['pendentes/**']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Envios seguidos entram em fila em vez de cancelar um ao outro.
concurrency:
  group: novo-card
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: processar
        run: |
          {
            echo 'titulos<<FIM_TITULOS'
            node scripts/processar-pendentes.mjs
            echo 'FIM_TITULOS'
          } >> "$GITHUB_OUTPUT"
      - run: npm run build
      - name: Commit e deploy
        env:
          GH_TOKEN: ${{ github.token }}
          TITULOS: ${{ steps.processar.outputs.titulos }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'Nenhum pendente para processar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/portfolio src/data/portfolio.json pendentes
          git commit -m "Adiciona card: $(echo "$TITULOS" | paste -sd ';' | sed 's/;/; /g')"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes feitos com o GITHUB_TOKEN não disparam outros workflows, então o deploy é chamado aqui.
          gh workflow run deploy.yml --ref main
